<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphify contributions</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Ctext x='32' y='43' font-family='sans-serif' font-size='34' font-weight='700' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
  <meta name="description" content="Pull requests by Deepjyoti-Sarmah on Graphify-Labs/graphify, with write-ups, live GitHub status and open proposals.">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="Graphify contributions">
  <meta property="og:description" content="Pull requests by Deepjyoti-Sarmah on Graphify-Labs/graphify, with write-ups, live GitHub status and open proposals.">
  <meta property="og:type" content="website">

  <script>
    // Apply the saved theme before first paint so dark-mode visitors do not see a light flash.
    (function () {
      var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      try {
        var saved = JSON.parse(localStorage.getItem('contrib:theme'));
        if (saved === 'dark' || saved === 'light') dark = saved === 'dark';
      } catch (e) { /* storage blocked: follow the system */ }
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>

  <style>
    /* Shape lock for this page: cards 16px (rounded-2xl), inputs and buttons 10px, badges and pills full. */
    html { scroll-behavior: smooth; }
    body { font-family: Outfit, Inter, ui-sans-serif, system-ui, sans-serif; }
    h1, h2, h4 { text-wrap: balance; }
    p { text-wrap: pretty; }
    :focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; border-radius: 4px; }
    .skip-link { position: absolute; left: 1rem; top: -3rem; z-index: 60; background: #4f46e5; color: #fff; padding: 0.5rem 1rem; border-radius: 10px; font-size: 0.875rem; font-weight: 600; transition: top 200ms cubic-bezier(0.16, 1, 0.3, 1); }
    .skip-link:focus { top: 1rem; }
    /* Ambient depth: fixed, pointer-events-none, transform and opacity only. */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(42rem 22rem at 12% -4%, rgb(99 102 241 / 0.08), transparent 60%),
                  radial-gradient(36rem 20rem at 88% 0%, rgb(16 185 129 / 0.06), transparent 60%);
    }
    .dark body::before, body.dark::before { display: none; }
    #root { position: relative; z-index: 1; }
    /* Tactile cards: tinted shadow, GPU-safe transform and opacity only. */
    .card-lift { transition: transform 250ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 250ms cubic-bezier(0.16, 1, 0.3, 1), border-color 250ms cubic-bezier(0.16, 1, 0.3, 1); }
    .card-lift:hover { transform: translateY(-1px); box-shadow: 0 12px 32px -16px rgb(79 70 229 / 0.28); border-color: rgb(165 180 252 / 0.7); }
    .card-lift:active { transform: translateY(0) scale(0.99); }
    .pressable { transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1), background-color 200ms cubic-bezier(0.16, 1, 0.3, 1); }
    .pressable:active { transform: scale(0.98); }
    /* Skeleton loaders match the final card shape. */
    @keyframes shimmer { from { opacity: 0.45; } to { opacity: 1; } }
    .skeleton { animation: shimmer 1.1s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate; }
    /* Scroll entry: IntersectionObserver adds .in; transform and opacity only. */
    .reveal { opacity: 0; transform: translateY(12px); }
    .reveal.in { opacity: 1; transform: none; transition: transform 600ms cubic-bezier(0.16, 1, 0.3, 1), opacity 600ms cubic-bezier(0.16, 1, 0.3, 1); transition-delay: calc(var(--index, 0) * 60ms); }
    /* Markdown from GitHub PR descriptions (marked output). */
    .md > :first-child { margin-top: 0; }
    .md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin: 0.6em 0; }
    .md ul { list-style: disc; padding-left: 1.25em; }
    .md ol { list-style: decimal; padding-left: 1.25em; }
    .md h1, .md h2, .md h3, .md h4 { font-weight: 600; margin: 1em 0 0.4em; }
    .md h1 { font-size: 1.1rem; } .md h2 { font-size: 1.05rem; } .md h3, .md h4 { font-size: 0.95rem; }
    .md code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.85em; background: rgb(148 163 184 / 0.18); padding: 0 0.25em; border-radius: 4px; overflow-wrap: anywhere; }
    .md pre { background: rgb(148 163 184 / 0.14); padding: 0.75rem; border-radius: 8px; overflow-x: auto; white-space: pre; }
    .md pre code { background: none; padding: 0; overflow-wrap: normal; }
    .md table { display: block; overflow-x: auto; border-collapse: collapse; }
    .md th, .md td { border: 1px solid rgb(148 163 184 / 0.35); padding: 0.3rem 0.5rem; text-align: left; vertical-align: top; }
    .md a { color: #4f46e5; text-decoration: underline; overflow-wrap: anywhere; }
    .dark .md a { color: #a5b4fc; }
    .md img { max-width: 100%; height: auto; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0ms !important; animation-duration: 0ms !important; scroll-behavior: auto !important; }
      body::before { display: none; }
      .reveal { opacity: 1; transform: none; }
      .skeleton { animation: none; opacity: 0.7; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
